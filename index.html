<!DOCTYPE html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cuánto más — Calculadora freelance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>
    <main class="shell">
      <header class="brand">
        <p class="brand__name">Cuánto más</p>
        <p class="brand__tag">tengo que trabajar</p>
      </header>

      <p class="month" id="monthContext"></p>

      <div class="modes" role="tablist" aria-label="Modo de cálculo">
        <button
          type="button"
          class="modes__btn is-active"
          role="tab"
          aria-selected="true"
          data-mode="earn"
          id="modeEarn"
        >
          Cuánto cobro
        </button>
        <button
          type="button"
          class="modes__btn"
          role="tab"
          aria-selected="false"
          data-mode="target"
          id="modeTarget"
        >
          Cuánto trabajar
        </button>
      </div>

      <form class="form" id="calcForm" autocomplete="off">
        <label class="field">
          <span class="field__label">Tarifa por hora</span>
          <span class="field__input">
            <span class="field__prefix">$</span>
            <input
              type="number"
              id="rate"
              name="rate"
              min="0"
              step="any"
              inputmode="decimal"
              required
            />
          </span>
        </label>

        <label class="field" data-panel="earn">
          <span class="field__label">Horas trabajadas</span>
          <input
            type="number"
            id="hours"
            name="hours"
            min="0"
            step="any"
            inputmode="decimal"
          />
        </label>

        <label class="field is-hidden" data-panel="target">
          <span class="field__label">Objetivo del mes</span>
          <span class="field__input">
            <span class="field__prefix">$</span>
            <input
              type="number"
              id="target"
              name="target"
              min="0"
              step="any"
              inputmode="decimal"
            />
          </span>
        </label>

        <label class="field is-hidden" data-panel="target">
          <span class="field__label">Horas ya trabajadas<span class="field__optional"> (opcional) </span></span>
          <input
            type="number"
            id="hoursDone"
            name="hoursDone"
            min="0"
            step="any"
            inputmode="decimal"
          />
        </label>
      </form>

      <section class="result" aria-live="polite">
        <p class="result__label" id="resultLabel">Vas a cobrar</p>
        <p class="result__value" id="resultValue">—</p>
        <p class="result__hint is-hidden" id="resultHint"></p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
